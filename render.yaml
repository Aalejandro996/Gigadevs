services:

type: web
name: gigadevs-corp-web
env: node
plan: free
buildCommand: npm install && npm run build
startCommand: npm start
envVars:

key: NODE_ENV
value: production

key: DATABASE_URL
fromDatabase:
name: gigadevs-db
property: connectionString

databases:

name: gigadevs-db
plan: free
databaseName: gigadevs_production
user: giga_app_user